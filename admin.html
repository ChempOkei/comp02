        <section>
            
            <form action="GET">
                <h1>Админка: Добавить игру</h1>
                <label for="title">Название игры
                <input type="text" name="title" id="title" placeholder="Minecraft" required></label>
                <label for="type">Жанр
                <input type="text" name="type" id="type" placeholder="Песочница" required></label>
                <label for="pic">Изображение
                <input type="file" name="pic" id="pic" accept="image/*"></label>
                <label for="dev">Компания-разработчик
                <input type="text" name="dev" id="dev" placeholder="Mojang" required></label>
                <label for="desc">Описание
                <textarea type="text" name="desc" id="desc" placeholder="Популярая игра в жанре песочница..." required></textarea>
                <label for="price">Стоимость
                <input type="number" name="price" id="price" placeholder="3 499 ₽" required></label>
                <input type="submit" value="Добавить">
            </form>
        </section>
